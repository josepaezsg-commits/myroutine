<style>
  :root{
    --bg-top:#05060f;
    --bg-mid:#120c24;
    --bg-bottom:#1c1338;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.11);
    --text-1:#f5f5f8;
    --text-2:rgba(245,245,248,0.62);
    --text-3:rgba(245,245,248,0.38);
    --gold:#f5c542;
    --gold-soft:rgba(245,197,66,0.16);
    --blue:#5a93ff;
    --blue-soft:rgba(90,147,255,0.16);
    --green:#38d39f;
    --green-soft:rgba(56,211,159,0.16);
    --orange:#fb923c;
    --orange-soft:rgba(251,146,60,0.16);
    --pink:#f472b6;
    --pink-soft:rgba(244,114,182,0.16);
    --purple:#a78bfa;
    --purple-soft:rgba(167,139,250,0.16);
    --indigo:#7c86ff;
    --indigo-soft:rgba(124,134,255,0.16);
    --teal:#2dd4bf;
    --teal-soft:rgba(45,212,191,0.16);
    --gray:#9aa0ae;
    --gray-soft:rgba(154,160,174,0.14);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    color:var(--text-1);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(167,139,250,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(245,197,66,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:calc(86px + var(--safe-bottom));
    position:relative;
  }
  /* ---- Header ---- */
  .header{
    padding:calc(18px + var(--safe-top)) 20px 6px;
  }
  .header .eyebrow{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--gold);
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .header h1{
    font-size:30px;
    font-weight:750;
    letter-spacing:-0.02em;
    margin:0 0 3px;
  }
  .header .sub{
    font-size:15px;
    color:var(--text-2);
    margin:0 0 18px;
  }
  /* ---- Week strip (calendario) ---- */
  .week{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 20px 18px;
    scrollbar-width:none;
  }
  .week::-webkit-scrollbar{display:none;}
  .daychip{
    flex:0 0 auto;
    width:56px;
    padding:10px 0 11px;
    border-radius:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .daychip:active{transform:scale(0.94);}
  .daychip .dname{font-size:11px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.03em;}
  .daychip .dicon{width:20px; height:20px; opacity:.85;}
  .daychip .dtoday{
    width:5px;height:5px;border-radius:50%;background:var(--gold); margin-top:-2px;
  }
  .daychip.active{
    background:var(--glass-strong);
    border-color:rgba(245,197,66,0.55);
    box-shadow:0 0 0 1px rgba(245,197,66,0.25) inset, 0 8px 20px rgba(245,197,66,0.08);
  }
  .daychip.active .dname{color:var(--gold);}

  /* ---- Segmented / day title card ---- */
  .daytitle{
    margin:0 20px 18px;
    padding:16px 18px;
    border-radius:22px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(24px);
    backdrop-filter:blur(24px);
  }
  .daytitle .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .daytitle h2{font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .daytitle .badge{
    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:100px;
    background:var(--indigo-soft); color:var(--indigo); white-space:nowrap;
  }
  .daytitle p{font-size:13.5px; color:var(--text-2); margin:8px 0 0; line-height:1.45;}
  .verse{
    display:flex; align-items:center; gap:8px;
    margin-top:12px; padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.08);
    font-size:12.5px; color:var(--gold); font-weight:600;
  }

  /* ---- Timeline ---- */
  .timeline{
    margin:0 20px;
    position:relative;
    padding-left:34px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:15px; top:6px; bottom:6px;
    width:2px;
    background:linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    border-radius:2px;
  }
  .item{
    position:relative;
    margin-bottom:14px;
  }
  .item .node{
    position:absolute;
    left:-34px; top:14px;
    width:30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--glass-border);
  }
  .item .node svg{width:15px; height:15px;}
  .card{
    padding:13px 14px 13px 16px;
    border-radius:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-left:3px solid var(--gray);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    transition:border-color .2s ease;
  }
  .card .time{font-size:11.5px; font-weight:700; color:var(--text-3); letter-spacing:.02em; margin-bottom:3px;}
  .card .title{font-size:15.5px; font-weight:650; margin-bottom:2px; letter-spacing:-0.01em;}
  .card .desc{font-size:13px; color:var(--text-2); line-height:1.42;}
  .item.now .card{border-left-color:var(--gold); background:var(--glass-strong); box-shadow:0 0 0 1px rgba(245,197,66,0.3) inset;}
  .item.now .node{box-shadow:0 0 0 3px rgba(245,197,66,0.18);}
  .nowtag{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em;
    color:#0b0b12; background:var(--gold); padding:2px 7px; border-radius:100px; margin-left:6px; vertical-align:middle;
  }

  .footnote{
    margin:18px 20px 6px;
    padding:14px 16px;
    border-radius:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    font-size:13px; color:var(--text-2); line-height:1.5;
  }
  .footnote b{color:var(--text-1);}

  .section-title{
    margin:26px 20px 10px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3);
  }

  /* ---- Rules view ---- */
  .rulecard{
    margin:0 20px 12px;
    padding:15px 16px;
    border-radius:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    display:flex; gap:12px; align-items:flex-start;
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
  }
  .rulecard .num{
    flex:0 0 26px; height:26px; border-radius:50%;
    background:var(--gold-soft); color:var(--gold);
    font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .rulecard p{margin:0; font-size:13.6px; line-height:1.5; color:var(--text-2);}
  .rulecard p b{color:var(--text-1);}

  /* ---- Tab bar ---- */
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding-bottom:var(--safe-bottom);
    z-index:50;
  }
  .tabbar-inner{
    width:100%; max-width:520px;
    display:flex;
    background:rgba(15,12,28,0.72);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    backdrop-filter:blur(30px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.08);
    padding:10px 24px calc(10px + 2px);
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-3);
    font-family:inherit; font-size:10.5px; font-weight:600;
    padding:4px 0;
  }
  .tab svg{width:23px; height:23px;}
  .tab.active{color:var(--gold);}

  ::selection{background:rgba(245,197,66,0.3);}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="tabbar">
  <div class="tabbar-inner" id="tabbar"></div>
</div>

      {start:"09:00", end:"12:00", cat:"homeschool", title:"Homeschool con Santiago", desc:"Tu mejor energía de la semana — aprovéchala aquí."},
      {start:"12:00", end:"13:00", cat:"food", title:"Almuerzo", desc:""},
      {start:"13:00", end:"15:00", cat:"quiet", title:"Proyectos personales", desc:"Iglesia, apps, trabajo web."},
      {start:"15:00", end:"16:30", cat:"soccer", title:"Entrenamiento de soccer", desc:"Con Santiago."},

  },
  martes:{
    label:"Martes",
    badge:"Último día libre",
    sub:"Preparación para volver al turno del miércoles en la noche.",
    verse:"Filipenses 4:6-7",
    items:[
      {start:"06:30", end:"06:50", cat:"prayer", title:"Oración y lectura de la Palabra", desc:"20 min al despertar."},
      {start:"07:30", end:"07:50", cat:"exercise", title:"Ejercicio · 20 min", desc:""},
      {start:"07:50", end:"08:00", cat:"food", title:"Desayuno rápido", desc:"Alistarse para el día."},
      {start:"08:00", end:"11:00", cat:"homeschool", title:"Homeschool + actividades", desc:"Con los niños."},
      {start:"11:00", end:"13:00", cat:"quiet", title:"Almuerzo y tiempo libre", desc:""},
      {start:"13:00", end:"15:00", cat:"soccer", title:"Soccer / actividad al aire libre", desc:"Con Santiago."},
      {start:"16:00", end:"17:30", cat:"family", title:"Cena en familia", desc:""},

    ],
    footer:"Acostarte más tarde hoy es <b>intencional</b> — prepara tu cuerpo para la primera noche de turno del miércoles."

};

const WEEK = [
  {key:"miercoles", name:"Mié", full:"Miércoles", icon:"moon", jsday:3},
  {key:"trabajo", name:"Jue", full:"Jueves", icon:"moon", jsday:4},
  {key:"trabajo", name:"Vie", full:"Viernes", icon:"moon", jsday:5},
  {key:"trabajo", name:"Sáb", full:"Sábado", icon:"moon", jsday:6},
  {key:"domingo", name:"Dom", full:"Domingo", icon:"church", jsday:0},
  {key:"lunes", name:"Lun", full:"Lunes", icon:"sun", jsday:1},
  {key:"martes", name:"Mar", full:"Martes", icon:"sun", jsday:2},
];

const RULES = [
  "Protege el bloque de <b>6am–12pm sin excepciones</b> en jueves, viernes y sábado — avisa a la familia que es horario de \"papá dormido\", igual que si trabajaras de día. El <b>miércoles es distinto</b>: despiertas a las 12pm de un sueño normal, no de un turno.",
  "La <b>siesta de 45 min</b> antes del turno no es opcional — sin ella, las últimas horas del turno se sienten muy pesadas.",
  "El <b>domingo es de transición</b>, no de máximo rendimiento — tu cuerpo todavía está ajustando el reloj interno.",
  "El <b>martes en la noche</b>, acuéstate más tarde a propósito, para no perder tanto sueño el primer día de trabajo.",
  "Si notas que 6h + siesta no bastan después de unas semanas, ajusta: mueve el bloque principal a 5-5.5h y alarga la siesta.",
  "<b>Ejercicio diario, aunque sea poco</b> — 20-30 min todos los días. Ligero en días de trabajo y domingo; más completo el lunes, con sueño ya recuperado.",
  "<b>La oración y lectura bíblica van primero cada día</b> — antes que el ejercicio, antes que las tareas. Es lo que sostiene todo lo demás."
];

/* ---------------- STATE ---------------- */
const todayJs = new Date().getDay();
let selected = (WEEK.find(d => d.jsday === todayJs) || WEEK[0]).key;
let selectedIndex = WEEK.findIndex(d => d.jsday === todayJs); if(selectedIndex<0) selectedIndex=0;
let view = "horario";

function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function fmt(t){
  const [h,m] = t.split(":").map(Number);
  const period = h<12 ? "am" : "pm";
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}${m>0? ":"+String(m).padStart(2,"0"):""}${period}`;
}

/* ---------------- RENDER ---------------- */
function renderWeek(){
  return `<div class="week">` + WEEK.map((d,i)=>{
    const active = d.key===selected && i===selectedIndex ? "active" : (d.key===selected && selectedIndex<0 ? "active":"");
    const isSelectedChip = i===selectedIndex;
    return `<div class="daychip ${isSelectedChip?'active':''}" data-idx="${i}">
      <div class="dicon" style="color:${isSelectedChip?'var(--gold)':'var(--text-2)'}">${svg(d.icon)}</div>
      <div class="dname">${d.name}</div>
      ${d.jsday===todayJs?'<div class="dtoday"></div>':''}
    </div>`;
  }).join("") + `</div>`;
}

function renderHorario(){
  const day = DAYS[selected];
  const isToday = WEEK[selectedIndex].jsday === todayJs;
  const items = day.items.map(it=>{
    const c = CAT[it.cat];
    const isNow = isToday && it.start!==it.end && toMin(it.start) <= nowMin() && nowMin() < (toMin(it.end) > toMin(it.start) ? toMin(it.end) : toMin(it.end)+1440);
    return `<div class="item ${isNow?'now':''}">
      <div class="node" style="background:${c.soft}; color:${c.color};">${svg(c.icon)}</div>
      <div class="card" style="border-left-color:${c.color}">
        <div class="time">${fmt(it.start)}${it.end!==it.start? " – "+fmt(it.end):""}${isNow?'<span class="nowtag">AHORA</span>':''}</div>
        <div class="title">${it.title}</div>
        ${it.desc? `<div class="desc">${it.desc}</div>`:""}
      </div>
    </div>`;
  }).join("");

  return `
    <div class="header">
      <p class="eyebrow">Ritmo semanal</p>
      <h1>${WEEK[selectedIndex].full}</h1>
      <p class="sub">${day.label}${isToday? " · hoy":""}</p>
    </div>
    ${renderWeek()}
    <div class="daytitle">
      <div class="row">
        <h2>${day.label}</h2>
        <span class="badge">${day.badge}</span>
      </div>
      <p>${day.sub}</p>
      <div class="verse">${svg("book",'style="width:14px;height:14px"')} ${day.verse}</div>
    </div>
    <div class="timeline">${items}</div>
    <div class="footnote">${day.footer}</div>
    <div style="height:8px"></div>
  `;
}

function renderReglas(){
  return `
    <div class="header">
      <p class="eyebrow">Guía</p>
      <h1>Reglas clave</h1>
      <p class="sub">Lo que hace que este ritmo funcione de verdad.</p>
    </div>
    <div class="section-title">Para que funcione</div>
    ${RULES.map((r,i)=>`<div class="rulecard"><div class="num">${i+1}</div><p>${r}</p></div>`).join("")}
    <div class="section-title">Recuerda</div>
    <div class="rulecard">
      <div class="num">${svg("cross",'style="width:13px;height:13px"')}</div>
      <p>Ningún horario reemplaza el descanso en Dios. Este ritmo existe para <b>proteger</b> el tiempo con Él, con tu esposa y tus hijos — no para llenarlo todo.</p>
    </div>
    <div style="height:8px"></div>
  `;
}

function renderTabbar(){
  return `
    <button class="tab ${view==='horario'?'active':''}" data-view="horario">
      ${svg("cal")}<span>Horario</span>
    </button>
    <button class="tab ${view==='reglas'?'active':''}" data-view="reglas">
      ${svg("list")}<span>Reglas</span>
    </button>
  `;
}

function render(){
  document.getElementById("app").innerHTML = view==="horario" ? renderHorario() : renderReglas();
  document.getElementById("tabbar").innerHTML = renderTabbar();
  attachEvents();
}

function attachEvents(){
  document.querySelectorAll(".daychip").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = parseInt(el.dataset.idx);
      selectedIndex = idx;
      selected = WEEK[idx].key;
      render();
    });
  });
  document.querySelectorAll(".tab").forEach(el=>{
    el.addEventListener("click", ()=>{
      view = el.dataset.view;
      render();
    });
  });
}

render();
setInterval(()=>{ if(view==="horario") render(); }, 60000);
</script>
